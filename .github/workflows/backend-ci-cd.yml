name: Backend CI/CD

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/backend-ci-cd.yml"
      - ".python-version"
      - "Procfile"
      - "requirements.txt"
      - "backend/**"
      - "src/lib/api/finsight-backend.ts"
      - "src/components/backend-lab/**"
      - "src/app/(protected)/backend-lab/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/backend-ci-cd.yml"
      - ".python-version"
      - "Procfile"
      - "requirements.txt"
      - "backend/**"
      - "src/lib/api/finsight-backend.ts"
      - "src/components/backend-lab/**"
      - "src/app/(protected)/backend-lab/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m unittest backend.tests.test_inference_features backend.tests.test_api_app backend.tests.test_explanations -v

  frontend-contract:
    name: Frontend contract type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend API contract
        run: npx tsc --noEmit

  deploy-heroku:
    name: Deploy backend to Heroku
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Heroku secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY"
          test -n "$HEROKU_APP_NAME"

      - name: Deploy to Heroku Git
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          git push heroku HEAD:main

      - name: Verify deployed health endpoint
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          curl --fail --retry 10 --retry-delay 6 "https://${HEROKU_APP_NAME}.herokuapp.com/health"
